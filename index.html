<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST OS | NEURAL INTERFACE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap');
        
        :root { --cyan: #00f2ff; --bg: #010203; --danger: #ff003c; }
        * { box-sizing: border-box; cursor: crosshair; }
        body { background: var(--bg); color: var(--cyan); font-family: 'Share Tech Mono', monospace; margin: 0; height: 100vh; overflow: hidden; }
        body.alarm { --cyan: var(--danger); }

        /* HUD Izgarası */
        .hud { display: grid; grid-template-columns: 300px 1fr 300px; grid-template-rows: 60px 1fr 40px; height: 100vh; padding: 10px; gap: 15px; }
        .panel { border: 1px solid var(--cyan); background: rgba(0, 10, 20, 0.8); padding: 15px; position: relative; box-shadow: inset 0 0 30px rgba(0, 242, 255, 0.05); }

        /* Merkez Core - Sesli Dalga Efekti */
        .core-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .arc { 
            width: 250px; height: 250px; border: 2px solid var(--cyan); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; position: relative;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.2);
            transition: 0.3s;
        }
        .arc.speaking { transform: scale(1.1); box-shadow: 0 0 80px var(--cyan); border-width: 5px; }
        .inner-spin { position: absolute; width: 90%; height: 90%; border: 2px dashed var(--cyan); border-radius: 50%; animation: spin 10s linear infinite; }

        #response-text { 
            font-family: 'Orbitron'; font-size: 22px; text-align: center; margin-top: 50px; 
            min-height: 80px; text-shadow: 0 0 15px var(--cyan); font-weight: 900;
        }

        /* Saat ve Veriler */
        #clock { font-family: 'Orbitron'; font-size: 32px; font-weight: 900; }
        .stat { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body id="b">
    <div class="hud">
        <div class="panel" style="grid-column: 1/4; display: flex; justify-content: space-between; align-items: center;">
            <div id="clock">00:00:00</div>
            <div style="font-family:'Orbitron'; letter-spacing: 5px;">GHOST NEURAL OS V3.5</div>
            <div id="mic-tag" style="font-weight:bold;">READY</div>
        </div>

        <div class="panel">
            <h3 style="font-family:'Orbitron'; font-size:12px;">CORE_STATUS</h3>
            <div class="stat"><span>AI_LOGIC</span><span style="color:#fff">ENABLED</span></div>
            <div class="stat"><span>NEURAL_NET</span><span style="color:#fff">ACTIVE</span></div>
            <div class="stat"><span>VOICE_SYNTH</span><span style="color:#fff">HQ_V3</span></div>
            <hr style="border:0; border-top:1px solid var(--cyan); opacity:0.3; margin:15px 0;">
            <div id="logs" style="font-size:10px; opacity:0.6; height:200px; overflow:hidden;">> System boot...</div>
        </div>

        <div class="core-zone">
            <div class="arc" id="visualizer">
                <div class="inner-spin"></div>
                <div style="font-family:'Orbitron'; font-size:14px; font-weight:bold;">AI</div>
            </div>
            <div id="response-text">SİZİ DİNLİYORUM...</div>
        </div>

        <div class="panel">
            <h3 style="font-family:'Orbitron'; font-size:12px;">COMMAND_HISTORY</h3>
            <div id="history" style="font-size:12px; opacity:0.8;"></div>
        </div>

        <div class="panel" style="grid-column: 1/4; font-size:10px; display:flex; justify-content:space-between;">
            <span>Diyarbakır Terminal 01</span>
            <span>SECURE ENCRYPTION: 1024-BIT</span>
            <span>GHOST SOFTWARE CORP.</span>
        </div>
    </div>

<script>
    let rec;
    let isSpeaking = false;
    let lockMic = false;

    function updateOS() {
        const d = new Date();
        document.getElementById('clock').innerText = d.toTimeString().split(' ')[0];
    }
    setInterval(updateOS, 1000);

    const answers = {
        nasil: ["Sistemim mükemmel çalışıyor, sizin için ne yapabilirim?", "Çekirdek sıcaklığım normal, her şey yolunda efendim.", "Veri akışım kusursuz, komutlarınızı bekliyorum."],
        kim: ["Ben Ghost Software, sizin dijital yansımanızım.", "Görünmez bir yardımcı, güçlü bir yapay zekayım."],
        selam: ["Selam efendim, tüm sistemler emrinizde.", "Merhaba, Hayalet Protokolü hazır."],
        alarm: ["Kırmızı alarm! Güvenlik katmanları aktif edildi!", "Saldırı algılandı, savunma moduna geçiliyor!"]
    };

    function ghostTalk(text) {
        isSpeaking = true;
        lockMic = true;
        if(rec) try { rec.stop(); } catch(e) {}

        const arc = document.getElementById('visualizer');
        arc.classList.add('speaking');
        document.getElementById('response-text').innerText = text;
        document.getElementById('mic-tag').innerText = "TALKING...";
        document.getElementById('mic-tag').style.color = "yellow";

        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'tr-TR';
        msg.rate = 1.0;
        msg.pitch = document.body.classList.contains('alarm') ? 0.6 : 0.8;
        
        msg.onend = () => {
            isSpeaking = false;
            arc.classList.remove('speaking');
            setTimeout(() => { lockMic = false; listen(); }, 500);
        };

        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(msg);
    }

    function initOS() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        rec = new SR();
        rec.lang = 'tr-TR';
        rec.continuous = false;

        rec.onresult = (e) => {
            if(lockMic) return;
            const cmd = e.results[e.results.length - 1][0].transcript.toLowerCase();
            handleAI(cmd);
        };

        rec.onend = () => { if(!isSpeaking && !lockMic) listen(); };
        ghostTalk("Yapay zeka modülleri yüklendi. Artık çok daha akıllıyım efendim.");
    }

    function listen() {
        if(isSpeaking || lockMic) return;
        try { 
            rec.start(); 
            document.getElementById('mic-tag').innerText = "LISTENING";
            document.getElementById('mic-tag').style.color = "#00f2ff";
        } catch(e) {}
    }

    function handleAI(cmd) {
        document.getElementById('history').innerHTML = `> ${cmd}<br>` + document.getElementById('history').innerHTML;
        
        if(cmd.includes("nasılsın")) {
            ghostTalk(answers.nasil[Math.floor(Math.random() * answers.nasil.length)]);
        } 
        else if(cmd.includes("ismin") || cmd.includes("kimsin")) {
            ghostTalk(answers.kim[Math.floor(Math.random() * answers.kim.length)]);
        }
        else if(cmd.includes("selam") || cmd.includes("merhaba")) {
            ghostTalk(answers.selam[Math.floor(Math.random() * answers.selam.length)]);
        }
        else if(cmd.includes("kırmızı alarm") || cmd.includes("saldırı")) {
            document.body.classList.add('alarm');
            ghostTalk(answers.alarm[Math.floor(Math.random() * answers.alarm.length)]);
        }
        else if(cmd.includes("normal") || cmd.includes("güvenli")) {
            document.body.classList.remove('alarm');
            ghostTalk("Sistem tehdidi temizlendi. Normale dönüldü.");
        }
        else if(cmd.includes("araştır") || cmd.includes("nedir") || cmd.includes("bul")) {
            let q = cmd.replace("araştır", "").replace("nedir", "").replace("bul", "");
            ghostTalk(q + " konusunu global veri ağında analiz ediyorum.");
            setTimeout(() => window.open("https://www.google.com/search?q=" + q, "_blank"), 1500);
        }
        else {
            ghostTalk("Veri alındı: " + cmd);
        }
    }

    window.onload = () => { setTimeout(initOS, 1000); };
    setInterval(() => { if(!isSpeaking && !lockMic) listen(); }, 2000);
</script>
</body>
</html>
