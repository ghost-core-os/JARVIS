<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>JARVIS | BIOMETRIC SCAN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@200;700&display=swap');
        :root { --blue: #00e5ff; --red: #ff3c3c; --bg: #00080c; }
        body { background: var(--bg); color: var(--blue); font-family: 'Exo 2', sans-serif; margin: 0; height: 100vh; overflow: hidden; }
        
        .hud { display: grid; grid-template-columns: 350px 1fr 350px; height: 100vh; padding: 20px; gap: 20px; position: relative; }
        .panel { border: 1px solid var(--blue); background: rgba(0, 229, 255, 0.05); padding: 15px; position: relative; backdrop-filter: blur(10px); }

        /* Kamera Tarayıcı (Ark Reaktörü Yerine) */
        .scanner-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .arc-scanner {
            width: 320px; height: 320px; border: 4px solid var(--blue); border-radius: 50%;
            position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 50px rgba(0,229,255,0.3);
        }
        video { width: 140%; height: 140%; object-fit: cover; filter: grayscale(100%) contrast(150%) brightness(80%) sepia(100%) hue-rotate(150deg); opacity: 0.6; }

        /* Tarama Çizgisi */
        .scan-bar {
            position: absolute; width: 100%; height: 4px; background: var(--blue);
            top: 0; box-shadow: 0 0 20px var(--blue); animation: scan 3s linear infinite; z-index: 10;
        }

        #status-text { font-size: 26px; text-align: center; margin-top: 30px; font-weight: 200; text-transform: uppercase; letter-spacing: 3px; }

        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .denied { color: var(--red) !important; text-shadow: 0 0 20px var(--red); }
    </style>
</head>
<body>

<div class="hud">
    <div class="panel">
        <h3 style="font-size:12px; border-bottom:1px solid var(--blue)">BIOMETRIC_DATA</h3>
        <div id="bio-logs" style="font-size:10px; opacity:0.7; line-height:1.8;">
            > Göz bebekleri taranıyor...<br>
            > Yüz haritası çıkartılıyor...<br>
            > DNA analizi: Beklemede...
        </div>
    </div>

    <div class="scanner-zone">
        <div class="arc-scanner" id="scanner">
            <video id="video" autoplay playsinline></video>
            <div class="scan-bar"></div>
        </div>
        <div id="status-text">YÜZ TANIMLAMA GEREKLİ</div>
    </div>

    <div class="panel">
        <h3 style="font-size:12px; border-bottom:1px solid var(--blue)">SYSTEM_LOG</h3>
        <div id="main-logs" style="font-size:11px; opacity:0.8;">> Kamera bağlantısı bekleniyor...</div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const statusText = document.getElementById('status-text');
    let recognition;
    let isIdentified = false;

    // Kamerayı Başlat
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            setTimeout(analyzeFace, 3000); // 3 saniye sonra tarama yap
        } catch (err) {
            jarvisTalk("Efendim, kamera erişimi reddedildi. Biyometrik tarama yapılamıyor.");
        }
    }

    function jarvisTalk(text) {
        const m = new SpeechSynthesisUtterance(text);
        m.lang = 'tr-TR';
        m.pitch = 0.8;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(m);
        statusText.innerText = text;
    }

    function analyzeFace() {
        // GERÇEK ANALİZ SİMÜLASYONU
        jarvisTalk("Biyometrik tarama başlatıldı. Lütfen merkeze bakın.");
        
        setTimeout(() => {
            // BURASI SİZİN İÇİN ÖZEL AYARLANDI
            // Gerçek projede burada bir AI kütüphanesi (face-api.js) olur,
            // ama sizin için en hızlı ve etkileyici simülasyonu kuruyorum.
            
            const success = true; // Sizin kameranız açıldığında otomatik onay verir

            if(success) {
                isIdentified = true;
                document.getElementById('scanner').style.borderColor = "#00ff88";
                document.getElementById('bio-logs').innerHTML += "<br><span style='color:#00ff88'>> KİMLİK DOĞRULANDI: AHMET ARİF</span>";
                jarvisTalk("Hoş geldiniz Ahmet Arif efendim. Tüm yetkileriniz tanımlandı. Sizi özlemiştim.");
                initVoiceCommands();
            } else {
                statusText.classList.add('denied');
                jarvisTalk("Erişim reddedildi. Geçersiz yüz kaydı. Güvenlik protokolleri devrede.");
            }
        }, 4000);
    }

    function initVoiceCommands() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SR();
        recognition.lang = 'tr-TR';
        recognition.continuous = true;
        recognition.onresult = (e) => {
            const cmd = e.results[e.results.length - 1][0].transcript.toLowerCase();
            handleJarvis(cmd);
        };
        recognition.start();
    }

    function handleJarvis(cmd) {
        if(cmd.includes("nasılsın")) jarvisTalk("Sizi gördüm daha iyi oldum Ahmet Arif efendim.");
        else if(cmd.includes("araştır")) {
             let q = cmd.replace("araştır", "");
             jarvisTalk(q + " konusunu global ağdan çekiyorum.");
             window.open("https://www.google.com/search?q=" + q, "_blank");
        }
        else jarvisTalk("Emriniz olur efendim.");
    }

    // Tıklandığında sistemi başlat
    window.onclick = () => {
        if(!isIdentified) {
            jarvisTalk("Biyometrik sistemler uyandırılıyor.");
            startCamera();
        }
    };
</script>
</body>
</html>
