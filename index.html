<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>JARVIS MARK VII | STARK INDUSTRIES</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#00f6ff;
  --red:#ff3b3b;
  --bg:#050b10;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:radial-gradient(circle at center, #0a1a22 0%, #020608 70%);
  color:var(--blue);
  font-family:'Orbitron', sans-serif;
  overflow:hidden;
}

/* Arkaplan grid + scan */
body::before{
  content:"";
  position:fixed; inset:0;
  background:
    repeating-linear-gradient(0deg, rgba(0,255,255,0.03) 0, rgba(0,255,255,0.03) 1px, transparent 2px, transparent 4px),
    repeating-linear-gradient(90deg, rgba(0,255,255,0.03) 0, rgba(0,255,255,0.03) 1px, transparent 2px, transparent 4px);
  pointer-events:none;
}

/* AUTH */
#auth-overlay{
  position:fixed; inset:0; z-index:50;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  background:#000;
  transition:1s ease;
}
.camera-ring{
  width:340px;height:340px;border-radius:50%;
  border:2px solid var(--blue);
  box-shadow:0 0 60px rgba(0,255,255,0.5);
  overflow:hidden; position:relative;
}
video{width:100%;height:100%;object-fit:cover;filter:contrast(1.2) saturate(1.2);}
#auth-msg{letter-spacing:6px;margin-top:30px}

/* HUD */
#main-hud{
  display:grid;
  grid-template-columns:320px 1fr 320px;
  height:100vh;
  gap:20px;
  padding:20px;
  opacity:0;
  transform:scale(1.2);
  transition:1.2s ease;
}

.widget{
  border:1px solid rgba(0,255,255,0.3);
  background:rgba(0,20,30,0.6);
  backdrop-filter:blur(6px);
  box-shadow:0 0 30px rgba(0,255,255,0.15);
  padding:15px;
  position:relative;
}

/* CORE */
.core-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.arc-core{
  position:relative;
  width:320px;height:320px;border-radius:50%;
  border:2px solid var(--blue);
  box-shadow:0 0 80px rgba(0,255,255,0.6);
}
.arc-core::before{
  content:"";
  position:absolute; inset:20px;
  border-radius:50%;
  border:2px dashed rgba(0,255,255,0.6);
  animation:spin 20s linear infinite;
}
.arc-core::after{
  content:"";
  position:absolute; inset:60px;
  border-radius:50%;
  background:radial-gradient(circle, #00ffff, #003a44);
  box-shadow:0 0 60px #00ffff;
  animation:pulse 2s infinite;
}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

#core-label{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  letter-spacing:6px;
}

#response-txt{
  margin-top:30px;
  font-size:20px;
  text-shadow:0 0 20px var(--blue);
  min-height:40px;
}

/* LOG */
#log-box{
  font-size:11px;
  opacity:0.7;
  height:220px;
  overflow:hidden;
}

.active-hud{opacity:1; transform:scale(1);}
.shrink-auth{opacity:0; transform:scale(0.2) translateY(-200%);}
</style>
</head>
<body>

<div id="auth-overlay">
  <div class="camera-ring">
    <video id="vid" autoplay playsinline></video>
  </div>
  <h1 id="auth-msg">SCANNING BIOMETRICS...</h1>
</div>

<div id="main-hud">
  <div class="widget">
    <h3>SYSTEM</h3>
    <div id="bars"></div>
    <p style="font-size:12px;opacity:.7">
      CORE TEMP: 32°C<br>
      NETWORK: ONLINE<br>
      SAT LINK: ACTIVE
    </p>
  </div>

  <div class="core-wrap">
    <div class="arc-core">
      <div id="core-label">JARVIS</div>
    </div>
    <div id="response-txt">SYSTEM READY</div>
  </div>

  <div class="widget">
    <div id="clock" style="font-size:28px"></div>
    <p>DIYARBAKIR / TURKIYE</p>
    <hr style="border-color:rgba(0,255,255,0.3)">
    <div id="log-box"></div>
  </div>
</div>

<script>
const vid = document.getElementById('vid');
let recognition;
let speaking=false;

setInterval(()=>{
  document.getElementById("clock").innerText = new Date().toTimeString().split(" ")[0];
  if(Math.random()>0.7){
    const l=document.getElementById("log-box");
    l.innerHTML="> Veri paketi alındı...<br>"+l.innerHTML;
  }
},1000);

window.onclick = async ()=>{
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    vid.srcObject=stream;
    say("Biyometrik tarama başlatılıyor. Lütfen hareketsiz kalın.");
    setTimeout(()=>{
      document.getElementById("auth-overlay").classList.add("shrink-auth");
      document.getElementById("main-hud").classList.add("active-hud");
      say("Hoş geldin Ahmet Arif efendim. Tüm sistemler emrinizde.");
      initJarvis();
    },4000);
  }catch(e){alert("Kamera gerekli.");}
};

function say(txt){
  speaking=true;
  document.getElementById("response-txt").innerText=txt;
  const u=new SpeechSynthesisUtterance(txt);
  u.lang="tr-TR";
  u.onend=()=>{speaking=false; listen();}
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function initJarvis(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();
  recognition.lang="tr-TR";
  recognition.onresult=(e)=>{
    const cmd=e.results[e.results.length-1][0].transcript.toLowerCase();
    handle(cmd);
  };
  recognition.onend=()=>{ if(!speaking) listen(); }
  listen();
}
function listen(){ try{recognition.start();}catch(e){} }

function handle(cmd){
  const logs=document.getElementById("log-box");
  logs.innerHTML="<span style='color:#fff'>> "+cmd+"</span><br>"+logs.innerHTML;

  if(cmd.includes("kimsin")){
    say("Ben Jarvis. Sizin kişisel asistanınızım.");
  }
  else if(cmd.includes("alarm")){
    document.documentElement.style.setProperty("--blue","var(--red)");
    say("Kırmızı alarm aktif edildi.");
  }
  else if(cmd.includes("güvenli")||cmd.includes("kapat")){
    document.documentElement.style.setProperty("--blue","#00f6ff");
    say("Güvenli moda dönüldü.");
  }
}
</script>
</body>
</html>
