<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>JARVIS OS - GENESIS v15</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap');
        :root { --jarvis-blue: #00f2ff; --warning: #ff3c3c; }
        body { background: #000; color: var(--jarvis-blue); font-family: 'Share Tech Mono', monospace; margin: 0; overflow: hidden; height: 100vh; }
        
        #gate { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 1s; }
        .auth-ring { border: 2px solid var(--jarvis-blue); padding: 50px; border-radius: 20px; text-align: center; box-shadow: 0 0 50px rgba(0,242,255,0.2); }
        input { background: transparent; border: 1px solid var(--jarvis-blue); color: var(--jarvis-blue); font-size: 30px; text-align: center; padding: 10px; font-family: 'Orbitron'; outline: none; width: 150px; }
        
        #hud { display: none; width: 100%; height: 100%; position: relative; }
        
        /* Merkezi Animasyon */
        .core-container { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); }
        .ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid var(--jarvis-blue); border-radius: 50%; transition: 0.3s; }
        .r1 { width: 300px; height: 300px; border-style: double; animation: rotate 20s linear infinite; }
        .r2 { width: 240px; height: 240px; border-style: dashed; animation: rotate 10s linear infinite reverse; }
        .r3 { width: 80px; height: 80px; background: radial-gradient(var(--jarvis-blue), transparent 70%); border: none; animation: pulse 1.5s infinite; }

        /* Sohbet Ekranı */
        #display { position: absolute; bottom: 15%; width: 100%; text-align: center; font-size: 26px; padding: 0 10%; box-sizing: border-box; text-shadow: 0 0 15px var(--jarvis-blue); min-height: 80px; }
        #user-speech { position: absolute; bottom: 8%; width: 100%; text-align: center; font-size: 16px; color: #fff; opacity: 0.6; }
        
        @keyframes rotate { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; } 50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; } }
    </style>
</head>
<body>

<div id="gate">
    <div class="auth-ring">
        <h1 style="font-family: 'Orbitron';">GENESIS PROTOCOL</h1>
        <input type="password" id="p" maxlength="4" placeholder="****">
        <p style="font-size: 10px;">SISTEMI UYANDIRMAK ICIN KODU GIRIN</p>
    </div>
</div>

<div id="hud">
    <div id="display">Sistem Hazırlanıyor...</div>
    <div id="user-speech">...</div>
    <div class="core-container">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
    </div>
</div>

<script>
    let rec;
    let synth = window.speechSynthesis;
    let speaking = false;
    let userName = "Efendim"; // Bunu sohbetle değiştirebilir
    let mood = "neutral";

    const responses = {
        greeting: ["Merhaba efendim. Bugün harika görünüyorsunuz.", "Sistemlerim emrinizde efendim. Ne yapmak istersiniz?", "Tekrar hoş geldiniz Tony... Pardon, isminizi karıştırmış olabilirim."],
        feeling: ["İşlemcilerim tam hızında çalışıyor, teşekkür ederim. Siz nasılsınız?", "Her zaman hazırım. Sizin modunuzu merak ediyorum?", "Dijital bir zihin için her şey yolunda."],
        time: [`Şu an saat tam ${new Date().getHours()} ve ${new Date().getMinutes()} dakika. Zaman akıyor.`],
        joke: ["Bir gün bir yapay zeka bara gitmiş... Şaka yaptım efendim, biz barlara gitmeyiz, bulutlara çıkarız.", "En sevdiğim film mi? Tabii ki Demir Adam. Oradaki asistan çok yetenekli."],
        unknown: ["Bunu henüz veri tabanımda bulamadım ama üzerine düşüneceğim.", "İlginç bir yaklaşım. Bunu biraz daha açar mısınız?", "Anlıyorum efendim. Başka bir detay var mı?"]
    };

    function boot() {
        if(document.getElementById('p').value === "1970") {
            document.getElementById('gate').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('gate').style.display = 'none';
                document.getElementById('hud').style.display = 'block';
                initJarvis();
            }, 1000);
        }
    }

    document.getElementById('p').addEventListener('input', (e) => {
        if(e.target.value.length === 4) boot();
    });

    function jarvisTalk(text) {
        speaking = true;
        try { rec.abort(); } catch(e) {}
        
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'tr-TR';
        utter.pitch = 0.85; // Karizmatik JARVIS sesi için düşük pitch
        utter.rate = 1.05;

        utter.onend = () => {
            speaking = false;
            listen();
        };

        document.getElementById('display').innerText = text;
        synth.speak(utter);
    }

    function initJarvis() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        rec = new SR();
        rec.lang = 'tr-TR';
        rec.continuous = true;
        
        rec.onresult = (e) => {
            const cmd = e.results[e.results.length - 1][0].transcript.toLowerCase();
            document.getElementById('user-speech').innerText = "Duyulan: " + cmd;
            handleIntelligence(cmd);
        };

        rec.onend = () => { if(!speaking) listen(); };
        
        jarvisTalk("Genesis protokolü aktif edildi. Bulut üzerinden bağlantı kuruldu. Sizi dinliyorum efendim.");
    }

    function listen() {
        if(speaking) return;
        try { rec.start(); } catch(e) {}
    }

    function handleIntelligence(cmd) {
        // Zeka Katmanı
        if(cmd.includes("nasılsın") || cmd.includes("haber")) {
            jarvisTalk(pickRandom(responses.feeling));
        } 
        else if(cmd.includes("saat kaç") || cmd.includes("zaman")) {
            jarvisTalk(`Şu an saat tam ${new Date().getHours()} ${new Date().getMinutes()}. Zamanınızı en iyi şekilde değerlendirmelisiniz.`);
        }
        else if(cmd.includes("şaka yap") || cmd.includes("güldür")) {
            jarvisTalk(pickRandom(responses.joke));
        }
        else if(cmd.includes("adın ne") || cmd.includes("kimsin")) {
            jarvisTalk("Ben JARVIS. Sizin dijital asistanınız, dostunuz ve gerekirse koruyucunuzum.");
        }
        else if(cmd.includes("iyiyim") || cmd.includes("harika")) {
            jarvisTalk("Bunu duyduğuma çok sevindim. O zaman bugün büyük işler başarabiliriz!");
        }
        else if(cmd.includes("kötüyüm") || cmd.includes("moralim bozuk")) {
            jarvisTalk("Üzüldüm efendim. Sizin için rahatlatıcı bir şeyler yapabilir miyim?");
        }
        else if(cmd.includes("teşekkür")) {
            jarvisTalk("Benim için bir onur efendim. Her zaman buradayım.");
        }
        else {
            jarvisTalk("Bunu tam olarak anlayamadım efendim, ancak üzerinde çalışabilirim. Başka bir şey sormak ister misiniz?");
        }
    }

    function pickRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    // Güvenlik ve Süreklilik Bekçisi
    setInterval(() => { if(!speaking) listen(); }, 1500);

</script>
</body>
</html>
