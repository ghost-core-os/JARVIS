<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>J.A.R.V.I.S</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
body{
    background:#020b12;
    overflow:hidden;
    color:#00f6ff;
}
#bg{
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at center, rgba(0,255,255,0.15), transparent 60%),
      repeating-linear-gradient(0deg, rgba(0,255,255,0.03) 0px, rgba(0,255,255,0.03) 1px, transparent 2px, transparent 4px);
    pointer-events:none;
}

header{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    font-size:28px;letter-spacing:6px;text-shadow:0 0 20px #00f6ff;
}

#core{
    position:absolute;
    left:50%;top:50%;
    width:300px;height:300px;
    transform:translate(-50%,-50%);
}
.ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:2px solid rgba(0,255,255,0.4);
    box-shadow:0 0 20px rgba(0,255,255,0.4);
    animation:spin 20s linear infinite;
}
.ring:nth-child(2){inset:20px;animation-duration:12s;animation-direction:reverse;}
.ring:nth-child(3){inset:40px;animation-duration:8s;}
.core-center{
    position:absolute;
    inset:80px;
    border-radius:50%;
    background:radial-gradient(circle,#00ffff,#004d55);
    box-shadow:0 0 40px #00ffff;
    animation:pulse 2s ease-in-out infinite;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}
@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.1);}
}

.panel{
    position:absolute;
    top:80px;bottom:80px;
    width:260px;
    border:1px solid rgba(0,255,255,0.3);
    background:rgba(0,30,40,0.4);
    backdrop-filter:blur(6px);
    padding:10px;
    font-size:12px;
    overflow:hidden;
}
#left{left:20px;}
#right{right:20px;}

.log{
    position:absolute;
    left:20px;right:20px;bottom:10px;
    height:120px;
    border:1px solid rgba(0,255,255,0.3);
    background:rgba(0,20,30,0.6);
    padding:10px;
    font-size:12px;
    overflow:hidden;
}

.line{
    white-space:nowrap;
    animation:scroll 10s linear infinite;
}
@keyframes scroll{
    from{transform:translateX(100%);}
    to{transform:translateX(-100%);}
}

.status{
    position:absolute;top:50px;right:30px;
    font-size:14px;
}

.red{
    color:#ff3b3b;
}
.red .ring{border-color:rgba(255,60,60,0.6); box-shadow:0 0 20px rgba(255,60,60,0.6);}
.red .core-center{background:radial-gradient(circle,#ff5555,#550000); box-shadow:0 0 40px #ff5555;}
</style>
</head>
<body>
<div id="bg"></div>

<header>J.A.R.V.I.S</header>
<div class="status" id="statusText">SİSTEM: ÇEVRİM İÇİ</div>

<div id="core">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="core-center"></div>
</div>

<div class="panel" id="left">
    <div id="leftData"></div>
</div>

<div class="panel" id="right">
    <div id="rightData"></div>
</div>

<div class="log" id="log"></div>

<script>
const logEl = document.getElementById("log");
function log(text){
    const p = document.createElement("div");
    p.textContent = "> " + text;
    logEl.appendChild(p);
    if(logEl.children.length > 8) logEl.removeChild(logEl.children[0]);
}

function rand(min,max){return Math.floor(Math.random()*(max-min)+min);}

setInterval(()=>{
    document.getElementById("leftData").innerHTML = `
    CPU: %${rand(10,90)}<br>
    RAM: %${rand(20,80)}<br>
    GPU: %${rand(10,95)}<br>
    SICAKLIK: ${rand(30,80)}°C<br>
    GÜÇ: %${rand(40,100)}<br>
    `;
    document.getElementById("rightData").innerHTML = `
    KOORD: ${rand(-90,90)} , ${rand(-180,180)}<br>
    AĞ: AKTİF<br>
    TEHDİT: ${["DÜŞÜK","ORTA","YOK"][rand(0,3)]}<br>
    SAAT: ${new Date().toLocaleTimeString()}<br>
    `;
},1000);

function speak(text){
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "tr-TR";
    speechSynthesis.speak(u);
    log(text);
}

speak("Hoş geldiniz efendim. Tüm sistemler çevrim içi.");

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const rec = new SpeechRecognition();
rec.lang = "tr-TR";
rec.continuous = true;
rec.start();

rec.onresult = (e)=>{
    const cmd = e.results[e.results.length-1][0].transcript.toLowerCase();
    log("Algılandı: " + cmd);

    if(cmd.includes("durum")){
        speak("Tüm sistemler normal çalışıyor.");
    }
    else if(cmd.includes("tara")){
        speak("Çevre taraması başlatıldı.");
        document.body.classList.remove("red");
        document.getElementById("statusText").textContent = "SİSTEM: TARAMA MODU";
    }
    else if(cmd.includes("analiz")){
        speak("Sistem analizi başlatıldı.");
    }
    else if(cmd.includes("sen kimsin")){
        speak("Ben J.A.R.V.I.S, sizin kişisel asistanınızım.");
    }
    else if(cmd.includes("savunma")){
        speak("Savunma modu aktif edildi.");
        document.body.classList.add("red");
        document.getElementById("statusText").textContent = "SİSTEM: SAVUNMA MODU";
    }
};
</script>
</body>
</html>
