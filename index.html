<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST SOFTWARE | PRO SYSTEM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap');
        
        :root { 
            --accent: #00f2ff; 
            --bg: #000;
            --danger: #ff0000;
            --glow: rgba(0, 242, 255, 0.3);
        }

        body { 
            background: var(--bg); 
            color: var(--accent); 
            font-family: 'Share Tech Mono', monospace; 
            margin: 0; 
            overflow: hidden; 
            height: 100vh;
            transition: all 0.4s ease;
        }

        body.alarm { --accent: var(--danger); --glow: rgba(255, 0, 0, 0.4); }

        /* HUD Arayüzü */
        .hud-overlay { position: fixed; inset: 0; pointer-events: none; border: 20px solid transparent; border-image: linear-gradient(to bottom right, var(--accent), transparent) 1; opacity: 0.3; }
        
        .status-panel { position: absolute; top: 30px; left: 30px; border-left: 3px solid var(--accent); padding-left: 15px; }
        .mic-box { position: absolute; top: 30px; right: 30px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .mic-on { animation: blink 1s infinite; color: var(--accent); }

        /* Çekirdek */
        .center-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; position: relative; z-index: 10; }
        .arc-reactor { 
            width: 250px; height: 250px; border: 4px solid var(--accent); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 40px var(--glow); position: relative;
        }
        .inner-ring { width: 85%; height: 85%; border: 2px dashed var(--accent); border-radius: 50%; animation: spin 15s linear infinite; }
        
        /* Şifre Ekranı */
        #login { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .login-box { border: 1px solid var(--accent); padding: 50px; text-align: center; background: rgba(0,10,20,0.9); }
        input { background: transparent; border: none; border-bottom: 2px solid var(--accent); color: #fff; font-size: 32px; text-align: center; outline: none; font-family: 'Orbitron'; width: 140px; }

        #display-text { margin-top: 50px; font-size: 26px; text-align: center; max-width: 70%; font-family: 'Orbitron'; text-shadow: 0 0 10px var(--accent); }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    </style>
</head>
<body id="ghostBody">

<div id="login">
    <div class="login-box">
        <h1 style="font-family: 'Orbitron'; letter-spacing: 5px;">GHOST AUTH</h1>
        <input type="password" id="p" maxlength="4" placeholder="****">
        <br><br>
        <button onclick="boot()" style="background:var(--accent); color:#000; border:none; padding:12px 35px; cursor:pointer; font-family:'Orbitron'; font-weight:bold;">SİSTEMİ BAŞLAT</button>
    </div>
</div>

<div class="hud-overlay"></div>
<div class="status-panel">
    SİSTEM DURUMU: <span id="sys">NOMINAL</span><br>
    BAĞLANTI: ŞİFRELİ<br>
    ARAMA MODÜLÜ: HAZIR
</div>
<div class="mic-box mic-on" id="micStatus">DİNLENİYOR...</div>

<div class="center-container">
    <div class="arc-reactor">
        <div class="inner-ring"></div>
    </div>
    <div id="display-text">GHOST SOFTWARE HAZIR...</div>
</div>

<script>
    let recognition;
    let isSpeaking = false;
    let alarmActive = false;

    function boot() {
        if(document.getElementById('p').value === "1970") {
            document.getElementById('login').style.display = 'none';
            initGhostSystem();
        }
    }

    function ghostTalk(text) {
        isSpeaking = true;
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'tr-TR';
        msg.pitch = alarmActive ? 0.4 : 0.9;
        msg.rate = 1.0;
        
        document.getElementById('display-text').innerText = text;
        
        msg.onend = () => { isSpeaking = false; startListen(); };
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(msg);
    }

    function initGhostSystem() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SR();
        recognition.lang = 'tr-TR';
        recognition.continuous = true;

        recognition.onresult = (e) => {
            const cmd = e.results[e.results.length - 1][0].transcript.toLowerCase();
            handleLogic(cmd);
        };

        recognition.onend = () => { if(!isSpeaking) startListen(); };
        ghostTalk("Hayalet yazılım ana terminali aktif edildi. Sizi dinliyorum efendim.");
    }

    function startListen() {
        if(isSpeaking) return;
        try { recognition.start(); } catch(e) {}
    }

    function handleLogic(cmd) {
        console.log("Gelen Ses:", cmd);

        // KIRMIZI ALARM
        if(cmd.includes("kırmızı alarm") || cmd.includes("saldırı")) {
            alarmActive = true;
            document.getElementById('ghostBody').classList.add('alarm');
            document.getElementById('sys').innerText = "KRİTİK!";
            ghostTalk("Kırmızı alarm! Güvenlik protokolleri başlatıldı. Tehdit seviyesi maksimum!");
        } 
        else if(cmd.includes("alarmı kapat") || cmd.includes("güvenli mod")) {
            alarmActive = false;
            document.getElementById('ghostBody').classList.remove('alarm');
            document.getElementById('sys').innerText = "NOMINAL";
            ghostTalk("Tehdit bertaraf edildi. Güvenli moda dönülüyor.");
        }
        
        // İNTERNET ARAŞTIRMA
        else if(cmd.includes("araştır") || cmd.includes("nedir") || cmd.includes("kimdir")) {
            let search = cmd.replace("araştır", "").replace("nedir", "").replace("kimdir", "");
            ghostTalk(search + " konusunu internet ağında araştırıyorum.");
            setTimeout(() => {
                window.open("https://www.google.com/search?q=" + encodeURIComponent(search), "_blank");
            }, 1500);
        }
        
        // GENEL SOHBET
        else if(cmd.includes("nasılsın")) {
            ghostTalk("Sistem performansım %100. Sizinle çalışmak bir onur.");
        }
        else {
            ghostTalk("Anlaşıldı: " + cmd);
        }
    }

    setInterval(() => { if(!isSpeaking) startListen(); }, 2000);
</script>

</body>
</html>
